# SonarQuest task graph
#
# A node is workable when every id in `deps` is done AND `gate`
# evaluates true against graph/state.json.
#
# human_only: true    Claude cannot execute this. Surface it, never simulate.
# he_verifies: true   Completion is Yogesh's judgment call. Claude presents
#                     evidence and stops. Claude never marks these done.

meta:
  version: 2
  updated: 2026-08-29
  note: >
    v2 replaces the C++ engine spike with a thin Python prototype.
    Reason: every node must produce something the decision maker can
    verify himself. See DECISIONS.md D-009.

gates:
  phase0_go:
    expr: "phase0.decision == 'GO'"
    description: >
      At least 8 of 15 discovery calls scored 4 or higher. Set only by
      Yogesh via /score. Threshold locked before data collection.
  legal_clear:
    expr: "legal.misra_opinion == 'received' and legal.path != 'blocked'"
    description: >
      Written IP counsel opinion on MISRA text licensing in hand, and it
      does not close off a viable path.
  prototype_useful:
    expr: "prototype.gcs_judged == true and prototype.gcs_verdict != 'reject'"
    description: >
      Yogesh has looked at a generated Guideline Compliance Summary and
      judged it against his own audit experience. His verdict, not a
      metric.

nodes:

# ---------------------------------------------------------------
# TRACK: phase-0  — market validation. Human-led.
# ---------------------------------------------------------------

  - id: P0-01
    track: phase-0
    title: Email MISRA on licensing
    deps: []
    gate: always
    agent: scribe
    human_only: false
    he_verifies: false
    do: >
      Draft the four-question licensing email from docs/04-phase-0.md
      section 6. Show it to him. He sends it.
    verify: "state.legal.misra_email_sent has a date"

  - id: P0-02
    track: phase-0
    title: Engage IP counsel on MISRA text
    deps: [P0-01]
    gate: always
    agent: human
    human_only: true
    he_verifies: true
    do: >
      Brief counsel with the six questions in docs/04-phase-0.md.
      Budget INR 50k-1.5L. Written opinion, not verbal.
    verify: "state.legal.misra_opinion == 'received'"

  - id: P0-03
    track: phase-0
    title: Build 60-name target list
    deps: []
    gate: always
    agent: researcher
    human_only: false
    he_verifies: false
    do: >
      Expand the four tranches in docs/04-phase-0.md into
      validation/targets.md. Verify each company exists and the role is
      plausible - the doc list is unverified general knowledge.
      He can spot-check this, so work through it and then report.
    verify: "validation/targets.md has >= 60 rows with named roles"

  - id: P0-04
    track: phase-0
    title: Outreach wave 1
    deps: [P0-03]
    gate: always
    agent: human
    human_only: true
    he_verifies: true
    do: "40 LinkedIn messages, template A. Consultants and EV first."
    verify: "state.phase0.outreach_sent >= 40"

  - id: P0-05
    track: phase-0
    title: Conduct 15 discovery calls
    deps: [P0-04]
    gate: always
    agent: human
    human_only: true
    he_verifies: true
    do: >
      Run the script in docs/04-phase-0.md. Never pitch. Log each call
      within 30 minutes via /log-call. Q12 - where the GCS lives - must
      be asked in every call.
    verify: "count(validation/calls/*.md) >= 15"

  - id: P0-06
    track: phase-0
    title: Score and decide GO/NO-GO
    deps: [P0-05]
    gate: always
    agent: researcher
    human_only: false
    he_verifies: true
    do: >
      Tally scores. Report the count scoring 4+ and the Q12 answers
      verbatim. Present the number against the locked threshold.
      Do not recommend. He decides.
    verify: "state.phase0.decision in ['GO','NO-GO','RESEGMENT']"

# ---------------------------------------------------------------
# TRACK: prototype — thin Python wrapper. Every node ends in an
# artifact Yogesh can judge from his own quality-engineering
# experience. Parallel to phase-0.
#
# GPL-3.0 encumbered (wraps Cppcheck MISRA addon). Validation and
# demo only. Never shippable.
# ---------------------------------------------------------------

  - id: TP-01
    track: prototype
    title: Run Cppcheck MISRA addon and normalize its output
    deps: []
    gate: always
    agent: builder
    human_only: false
    he_verifies: false
    do: >
      Python. Run the addon over a codebase, parse its output into a
      normalized finding record: rule_id, file, line, enclosing symbol,
      category. Nothing clever. One script.
      Explain in plain language what it does before writing it.
    verify: "Produces a JSON list of findings from a real codebase"

  - id: TP-02
    track: prototype
    title: Pick and justify a test codebase
    deps: []
    gate: always
    agent: researcher
    human_only: false
    he_verifies: true
    do: >
      Propose 2-3 open-source embedded C codebases. For each, say why it
      does or does not resemble what a Tier-2 supplier's ECU code looks
      like. He knows what real automotive code looks like; you do not.
      He picks.
    verify: "state.prototype.corpus is set by Yogesh"

  - id: TP-03
    track: prototype
    title: Stable finding fingerprints
    deps: [TP-01, TP-02]
    gate: always
    agent: builder
    human_only: false
    he_verifies: false
    do: >
      Fingerprint on (rule_id, normalized surrounding code hash,
      enclosing symbol). Never line number.
      Demonstrate by reformatting the codebase and showing the
      fingerprint set is unchanged.
    verify: "clang-format over the corpus changes 0 fingerprints"

  - id: TP-04
    track: prototype
    title: Deviation register and GRP
    deps: [TP-03]
    gate: always
    agent: builder
    human_only: false
    he_verifies: true
    do: >
      The workflow: raise -> rationale -> risk -> reviewer -> approver
      -> expiry. Plus per-project rule re-categorization (GRP).
      Before building: show him the data model in plain language and ask
      whether it matches how a real quality department works. He has run
      this process; you have only read about it.
    verify: >
      Yogesh confirms the workflow matches real quality-department
      practice, or says what is missing.

  - id: TP-05
    track: prototype
    title: Generate a Guideline Compliance Summary
    deps: [TP-04]
    gate: always
    agent: builder
    human_only: false
    he_verifies: true
    do: >
      Produce a GCS document from the findings and deviation records,
      following the MISRA:2020 compliance-level structure
      (Compliant / Deviations / Violations / Disapplied).
      This is the product in miniature.
    verify: "A GCS document is produced from real data"

  - id: TP-06
    track: prototype
    title: Yogesh audits the GCS
    deps: [TP-05]
    gate: always
    agent: human
    human_only: true
    he_verifies: true
    do: >
      Read the generated GCS as if you were an OEM assessor receiving it
      from a supplier. Where would you reject it? What is missing that a
      real audit would demand? What would embarrass you to hand over?
      This is the highest-value hour in the whole project. Nobody else
      involved can do it.
      Record the verdict in state: accept / needs-work / reject.
    verify: "state.prototype.gcs_judged == true"

  - id: TP-07
    track: prototype
    title: Show the GCS to an external Functional Safety Manager
    deps: [TP-06]
    gate: prototype_useful
    agent: human
    human_only: true
    he_verifies: true
    do: >
      One of the Phase 0 consultant contacts. Not a pitch - a critique
      request. "Would this survive an assessment?"
    verify: "External written or verbal verdict recorded in validation/"

# ---------------------------------------------------------------
# TRACK: product — blocked on Phase 0.
# ---------------------------------------------------------------

  - id: PR-01
    track: product
    title: Productionize the compliance workspace
    deps: [P0-06, TP-07]
    gate: phase0_go
    agent: builder
    human_only: false
    he_verifies: true
    do: "See docs/02-product.md Module 2. Scope after Phase 0 findings."
    verify: "A design partner runs a real deviation end to end"

  - id: PR-02
    track: product
    title: Replace the GPL detector
    deps: [PR-01]
    gate: [phase0_go, legal_clear]
    agent: builder
    human_only: false
    he_verifies: false
    do: >
      The prototype's detector is GPL-3.0 and cannot ship. Options to
      evaluate at that point: license a commercial engine, build on
      Clang, or partner. This is where the C++ work returns, funded, and
      probably not done solo.
    verify: "Shippable detector in place, licensing cleared in writing"

