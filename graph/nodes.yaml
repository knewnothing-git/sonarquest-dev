# SonarQuest build graph
#
# Every `verify` is a shell command. Exit 0 = node done.
# No node requires human judgment. If one seems to, its verify is wrong.
#
# Run from repo root. Agent updates graph/state.json after each node.

meta:
  version: 3
  updated: 2026-08-29
  product: "Unified SAST + SCA platform (SonarQube + Black Duck alternative)"

nodes:

# ===== PHASE 1: FOUNDATION =====

  - id: F-01
    title: Repo scaffold and toolchain
    deps: []
    agent: builder
    do: >
      Create backend/ (Python 3.12, pyproject.toml, ruff, mypy, pytest),
      frontend/ (Vite + React + TS + Tailwind), docker-compose.yml with
      postgres + redis, Makefile with targets: install, lint, test, check,
      up, down. .env.example with all config keys.
    verify: "make check"

  - id: F-02
    title: FastAPI skeleton with health and version
    deps: [F-01]
    agent: builder
    do: >
      FastAPI app at backend/app/main.py. Routes /health (200, db+redis
      connectivity) and /api/v1/version. structlog JSON logging.
      Settings via pydantic-settings from env.
    verify: "make test-api"

  - id: F-03
    title: Database schema and migrations
    deps: [F-02]
    agent: builder
    do: >
      SQLAlchemy 2.x models + Alembic. Tables: organizations, projects,
      scans, findings, components, vulnerabilities, licenses,
      quality_gates, gate_results, suppressions.
      findings has fingerprint (unique per project), rule_id, severity,
      status, first_seen_scan, last_seen_scan.
    verify: "make migrate && make test-models"

# ===== PHASE 2: SCANNERS =====

  - id: F-04
    title: Repo ingestion and language detection
    deps: [F-03]
    agent: builder
    do: >
      Clone a git repo (gitpython) at a ref into a temp workspace.
      Detect languages by extension + content heuristics. Return a
      manifest: languages, file counts, package manifests found
      (package.json, requirements.txt, pom.xml, go.mod, Cargo.toml,
      pyproject.toml, build.gradle).
    verify: "pytest backend/tests/test_ingest.py -q"

  - id: F-05
    title: SAST runner (Semgrep) with normalized output
    deps: [F-04]
    agent: builder
    do: >
      Run Semgrep with its registry rulesets against the workspace.
      Parse JSON output into the Finding model: rule_id, message,
      severity, file, line, enclosing symbol, cwe, owasp.
      Fixture repo in tests/fixtures/vuln-app with known injectable
      findings (SQL injection, hardcoded secret, path traversal).
    verify: "pytest backend/tests/test_sast.py -q"

  - id: F-06
    title: SBOM generation (Syft)
    deps: [F-04]
    agent: builder
    do: >
      Run Syft over the workspace. Parse into Component records: purl,
      name, version, type, direct/transitive, source manifest.
      Export CycloneDX 1.5 and SPDX 2.3 via cyclonedx-python-lib.
    verify: "pytest backend/tests/test_sbom.py -q"

  - id: F-07
    title: Vulnerability matching (Grype + OSV)
    deps: [F-06]
    agent: builder
    do: >
      Match components against Grype db and the OSV API. Deduplicate by
      CVE. Record CVSS score, severity, fixed-in version, and whether a
      fix is available. Fixture with a pinned known-vulnerable dependency.
    verify: "pytest backend/tests/test_vulns.py -q"

  - id: F-08
    title: License detection and policy
    deps: [F-06]
    agent: builder
    do: >
      Identify declared licenses per component. Normalize to SPDX
      identifiers. Policy engine: allowlist / denylist / review-required,
      configurable per project. Flag copyleft (GPL, AGPL, LGPL) and
      unknown licenses.
    verify: "pytest backend/tests/test_licenses.py -q"

# ===== PHASE 3: CORE LOGIC =====

  - id: F-09
    title: Fingerprinting and baseline diff
    deps: [F-05, F-07]
    agent: builder
    do: >
      Fingerprint findings on (rule_id, normalized_snippet_hash,
      enclosing_symbol). Never line number. Diff a scan against the
      project baseline into new / fixed / unchanged.
      Test must prove reformatting the fixture repo changes zero
      fingerprints.
    verify: "pytest backend/tests/test_fingerprint.py -q"

  - id: F-10
    title: Quality gate engine
    deps: [F-09]
    agent: builder
    do: >
      Conditions on metrics: new critical findings, new high vulns,
      denied licenses, coverage delta, total blocker count.
      Operators: gt, lt, eq. Evaluate a scan, return PASS/FAIL with the
      failing conditions listed. Ship a sensible default gate.
    verify: "pytest backend/tests/test_gates.py -q"

  - id: F-11
    title: Scan orchestration
    deps: [F-08, F-10]
    agent: builder
    do: >
      Celery task chain: ingest -> run SAST + SCA in parallel ->
      normalize -> fingerprint -> diff baseline -> evaluate gate ->
      persist -> emit result. Scan status transitions with timestamps.
      Retry on transient failures. Hard timeout per scanner.
    verify: "pytest backend/tests/test_orchestration.py -q"

# ===== PHASE 4: SURFACES =====

  - id: F-12
    title: REST API v1
    deps: [F-11]
    agent: builder
    do: >
      /api/v1: projects CRUD, trigger scan, scan status, findings list
      with filters (severity, status, type, file), components list,
      vulnerabilities, SBOM export, gate config, suppressions.
      Pagination, sorting, and filtering on all list endpoints.
    verify: "pytest backend/tests/test_api.py -q && make openapi-validate"

  - id: F-13
    title: CLI scanner
    deps: [F-11]
    agent: builder
    do: >
      Typer CLI: `sq scan <path>` runs a local scan and prints a report.
      `--format json|table|sarif`. `--fail-on-gate` exits non-zero when
      the gate fails, so it drops straight into any CI.
    verify: "pytest backend/tests/test_cli.py -q"

  - id: F-14
    title: Dashboard frontend
    deps: [F-12]
    agent: builder
    do: >
      React + Vite + Tailwind. Pages: project list, project overview
      (gate status, finding counts, trend chart), findings table with
      filters, dependency inventory, vulnerabilities, license report,
      SBOM download. Dark theme, dense information layout.
    verify: "cd frontend && npm run build && npm run test -- --run"

  - id: F-15
    title: GitHub App and PR decoration
    deps: [F-12]
    agent: builder
    do: >
      GitHub App: webhook receiver for push and pull_request, HMAC
      signature verification, scan trigger, check run creation, inline
      review comments on new findings only, gate result as a required
      status check. Mock the GitHub API in tests.
    verify: "pytest backend/tests/test_github.py -q"

  - id: F-16
    title: Auth and multi-tenancy
    deps: [F-12]
    agent: builder
    do: >
      Organizations, users, API tokens. Role-based access: owner, admin,
      member, viewer. All queries scoped by organization. Token auth for
      CI, session auth for the dashboard.
    verify: "pytest backend/tests/test_auth.py -q"

# ===== PHASE 5: SHIP =====

  - id: F-17
    title: Production compose and deployment docs
    deps: [F-14, F-15, F-16]
    agent: builder
    do: >
      docker-compose.prod.yml: api, worker, beat, postgres, redis,
      frontend behind caddy with TLS. Healthchecks, restart policies,
      volume mounts. .env.prod.example. DEPLOY.md with a full walkthrough
      from clean host to running instance.
    verify: "make deploy-check"

  - id: F-18
    title: End-to-end smoke test
    deps: [F-17]
    agent: builder
    do: >
      Bring up the prod stack, register a project pointing at the fixture
      repo, trigger a scan, poll to completion, assert findings and
      components landed and the gate evaluated. Tear down.
    verify: "make e2e"
